services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - PORT=8077
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
      - TZ=${TZ:-Europe/Moscow}
      - UPDATER_URL=http://updater:8090
      - UPDATER_TOKEN=${UPDATER_TOKEN:-}
    volumes:
      - ./data:/data
    # Loopback only. The internet reaches the app through Caddy (TLS); this
    # publish exists just for local debugging on the host. Dropping the
    # 127.0.0.1 prefix would put plain HTTP on the public IP and bypass
    # HTTPS entirely — which also breaks the `secure` device cookie.
    ports:
      - "127.0.0.1:8077:8077"

  # Powers the admin panel's "Deploy from GitHub" button. Kept separate from
  # `app` on purpose: it's the only thing that touches the Docker socket and
  # the repo checkout, so a compromise of the (much larger) app codebase
  # doesn't automatically hand over the socket too. Still, Docker-socket
  # access is root-equivalent on the host — see docs/SETUP.md before enabling.
  updater:
    build: ./deploy/updater
    restart: unless-stopped
    environment:
      - UPDATER_TOKEN=${UPDATER_TOKEN:-}
      - REPO_DIR=${HOST_REPO_PATH}
      - DEPLOY_BRANCH=${DEPLOY_BRANCH:-main}
    volumes:
      # Must be the repo's real path on the HOST, not a container path: the
      # updater talks to the host's dockerd over the socket below, and the
      # daemon resolves bind-mount sources against its own (host) filesystem.
      - ${HOST_REPO_PATH}:${HOST_REPO_PATH}
      - /var/run/docker.sock:/var/run/docker.sock
    # No published port: reachable only from `app`, over the private compose
    # network, by service name.

  # Terminates TLS and reverse-proxies to `app`. This replaces the Cloudflare
  # Tunnel — the server is now reached directly on its public IP, so HTTPS is
  # ours to provide. Caddy obtains and renews Let's Encrypt certificates by
  # itself; SITE_DOMAIN must already resolve to this host or issuance fails.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates live here. Losing this volume means re-issuing on
      # every restart, which will hit Let's Encrypt's rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
