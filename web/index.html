<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E9E3D2">
  <title>Мои приложения</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #E9E3D2; color: #1D2430;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .wrap { width: 100%; max-width: 440px; text-align: center; }
    h1 { font-size: 26px; margin: 0 0 24px; }
    a.tile {
      display: flex; align-items: center; gap: 20px;
      background: #fff; border-radius: 18px; padding: 20px 24px;
      margin-bottom: 18px; text-decoration: none; color: #1D2430;
      font-size: 26px; font-weight: 600;
      box-shadow: 0 3px 14px rgba(29,36,48,0.18);
      border: 2px solid #C7BC9E;
    }
    a.tile:active { border-color: #9AA4B2; }
    a.tile img { width: 64px; height: 64px; border-radius: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Мои приложения</h1>
    <a class="tile" href="/video/"><img src="/icons/video-192.png" alt=""><span>Редактор танцев</span></a>
    <a class="tile" href="/files/"><img src="/icons/files-192.png" alt=""><span>Файлы</span></a>
    <a class="tile" href="/reminders/"><img src="/icons/rem-192.png" alt=""><span>Напоминания</span></a>
  </div>
</body>
</html>
