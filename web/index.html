<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E9E3D2">
  <link rel="manifest" href="/manifest-index.webmanifest">
  <link rel="icon" href="/icons/files-192.png">
  <link rel="apple-touch-icon" href="/icons/files-192.png">
  <title>Мой Диск</title>
  <style>
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; -moz-text-size-adjust: 100%; text-size-adjust: 100%; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #E9E3D2; color: #1D2430;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    /* Sized with clamp() rather than fixed px: every max is the original
       desktop value, so a wide screen renders exactly as it always has, while
       a narrow one (a phone, and especially a phone with browser zoom turned
       up — which shrinks the real CSS viewport well below 412px) scales the
       padding, icon and gap down instead of pushing the label off the edge.
       The label shrinks least: she needs it big, so the chrome gives way. */
    .wrap { width: 100%; max-width: 440px; text-align: center; }
    h1 { font-size: clamp(20px, 6vw, 26px); margin: 0 0 clamp(14px, 4vw, 24px); }
    a.tile {
      display: flex; align-items: center; gap: clamp(12px, 4vw, 20px);
      background: #fff; border-radius: 18px;
      padding: clamp(12px, 3.5vw, 20px) clamp(14px, 4vw, 24px);
      margin-bottom: clamp(12px, 3.5vw, 18px);
      text-decoration: none; color: #1D2430;
      font-size: clamp(18px, 5.5vw, 26px); font-weight: 600;
      box-shadow: 0 3px 14px rgba(29,36,48,0.18);
      border: 2px solid #C7BC9E;
      text-align: left;
    }
    a.tile:active { border-color: #9AA4B2; }
    a.tile img {
      width: clamp(44px, 14vw, 64px); height: clamp(44px, 14vw, 64px);
      border-radius: 14px; flex: 0 0 auto;
    }
    /* Without these the label is a flex item that refuses to shrink, so a long
       name ("Редактор танцев") runs past the tile and is clipped mid-word. */
    a.tile span { min-width: 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Мой Диск</h1>
    <a class="tile" href="/files/"><img src="/icons/files-192.png" alt=""><span>Файлы</span></a>
    <a class="tile" href="/voice/"><img src="/icons/voice-192.png" alt=""><span>Голос</span></a>
  </div>
</body>
</html>
